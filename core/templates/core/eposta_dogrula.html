<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>E-Posta Doğrulama - KampüsEvim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow p-4" style="max-width: 450px; width: 100%; border-radius: 15px;">
        <h3 class="text-center text-primary mb-3">📧 E-Posta Doğrulama</h3>
        <p class="text-muted text-center">
            <strong>{{ email }}</strong> adresine gönderdiğimiz 6 haneli doğrulama kodunu aşağıya giriniz.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-warning">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="kod" class="form-control form-control-lg text-center fw-bold" placeholder="123456" maxlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">Hesabımı Doğrula</button>
        </form>
    </div>
</body>
</html>
