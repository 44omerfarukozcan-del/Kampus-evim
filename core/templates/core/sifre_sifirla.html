{% extends 'core/base.html' %}
{% block content %}
<style>
    .auth-form input { display: block; width: 100%; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 0.375rem; margin-bottom: 1rem; }
    .auth-form label { font-weight: bold; margin-bottom: 0.5rem; color: #333; }
</style>
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header bg-warning text-dark text-center py-4">
                    <h3 class="mb-0 fw-bold">Şifremi Unuttum</h3>
                </div>
                <div class="card-body p-4 p-md-5 auth-form">
                    <p class="text-muted text-center mb-4">Sisteme kayıtlı e-posta adresinizi girin, size bir sıfırlama bağlantısı gönderelim.</p>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-warning btn-lg fw-bold">Şifremi Sıfırla</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
